<!DOCTYPE html>

<meta charset="UTF-8">

<title>Michael's Start Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    height:100vh;
    overflow:hidden;
    background:#000000; /* Solves bright flashes on load */
}

/* HIGH-PERFORMANCE WALLPAPER OVERLAY LAYER */
.bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.5s ease-in-out; /* Uses GPU processing to end the new tab lag */
}

.bg-overlay.fade-in {
    opacity: 1;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
    backdrop-filter: blur(0px);
    z-index: 2;
}

.content{
    position:relative;
    z-index:3;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    height:100vh;
    padding:20px;
}

.clock{
    font-size:70px;
    font-weight:bold;
    text-shadow: 0 0 15px currentColor;
}

.date{
    margin-top:10px;
    font-size:22px;
    opacity:0.9;
}

.search-box{
    margin-top:35px;
    width:100%;
    max-width:700px;
}

.search-box form{
    display:flex;
}

.search-box input{
    flex:1;
    padding:18px 22px;
    border:none;
    border-radius:15px 0 0 15px;
    background:#000000;
    color:#ae00ff;
    font-size:18px;
    outline:none;
}

.search-box button{
    padding:18px 28px;
    border:none;
    background:#1b1b1b;
    font-size:18px;
    cursor:pointer;
    border-radius:0 15px 15px 0;
    transition: 0.2s;
}

.search-box button:hover{
    opacity:0.9;
}

.links{
    margin-top:45px;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap:25px;
    width:100%;
    max-width:900px;
}

.link-card{
    text-decoration:none;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    padding:6px;

    /* Clean flexible horizontal and vertical grid elements centering */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transition:0.25s;
    backdrop-filter: blur(10px);
}

.link-card:hover{
    transform:translateY(-5px) scale(1.03);
    background:rgba(255,255,255,0.18);
    box-shadow: 0 0 15px currentColor;
}

.link-card img{
    width:96px;
    height:96px;
    object-fit:contain;
    margin-bottom:4px;
}

.link-card span{
    display:block;
    font-size:15px;
    word-break:break-word;
}

/* TOP TOOLBAR CONTAINER */
.top-toolbar {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 15px;
}

.picker-container input[type="color"] {
    -webkit-appearance: none;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    background: none;
}
.picker-container input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
}
.picker-container input[type="color"]::-webkit-color-swatch {
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
}

.bento-btn {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    padding: 5px;
    border-radius: 50%;
    transition: background-color 0.2s;
}
.bento-btn:hover { 
    background-color: rgba(255, 255, 255, 0.15); 
}
.bento-dot { 
    width: 4px; 
    height: 4px; 
    border-radius: 50%; 
}

.bento-dropdown {
    display: none;
    position: absolute;
    top: 50px;
    right: 0;
    width: 260px;
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid #00ff1e;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    padding: 15px;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    text-align: center;
    backdrop-filter: blur(10px);
}
.bento-dropdown.show-menu { 
    display: grid; 
}
.dropdown-app-link { 
    text-decoration: none; 
    color: #ffffff; 
    font-size: 11px; 
}
.dropdown-app-link img { 
    width: 36px; 
    height: 36px; 
    display: block; 
    margin: 0 auto 6px; 
}

.nav-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    object-fit: contain;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(0, 0, 0, 0.4);
    transition: transform 0.2s;
}
.nav-avatar:hover { 
    transform: scale(1.1);
}

/* NOTEPAD CONTAINER STYLING */
.notepad-container {
    margin-top: 30px;
    width: 100%;
    max-width: 900px;
    position: relative;
    z-index: 5;
}
.notepad-container textarea {
    width: 100%;
    height: 160px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    padding: 12px;
    color: #ffffff;
    font-size: 14px;
    resize: none;
    outline: none;
    backdrop-filter: blur(5px);
    transition: border-color 0.2s;
}
</style>

// ===========================
// CLOCK ENGINE
// ===========================
function updateClock(){
    const now = new Date();
    const time = now.toLocaleTimeString([], {
        hour: '2-digit',
        minute:'2-digit',
        hour12: false // Set true if you want 12-hour engine instead of 24h
    });
    const date = now.toLocaleDateString('en-AU', {
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    });
    document.getElementById('clock').textContent = time;
    document.getElementById('date').textContent = date;
}
setInterval(updateClock, 1000);
updateClock();


// ==========================================
// BACKGROUND AUTOMATED BATCH ENGINE LOOP
// ==========================================
// Generated from however many supported images are currently in the WALLZ folder.
const backgrounds = window.MICHAEL_WALLPAPERS || [];

let savedIndex = localStorage.getItem("michael_bg_index");
let current = savedIndex ? parseInt(savedIndex) : 0;

// Ensure indices are verified if total image size shrinks or shifts
if (current >= backgrounds.length) {
    current = 0;
}

function changeBackground(){
    const bgOverlay = document.getElementById('bgOverlay');
    
    if (backgrounds.length > 0) {
        // Remove class to reset transparency hook pipeline prior to asset switch
        bgOverlay.classList.remove('fade-in');
        
        bgOverlay.style.backgroundImage = `url('${backgrounds[current]}')`;
        
        // This tiny delay lets the browser read the heavy local PNG before fading it in smoothly
        setTimeout(() => {
            bgOverlay.classList.add('fade-in');
        }, 50);
        
        current++;
        if(current >= backgrounds.length){
            current = 0;
        }
        localStorage.setItem("michael_bg_index", current);
    }
}

const slideshowTime = 1800000; // Rotates exactly every 30 minutes (1800000 ms)
changeBackground();
setInterval(changeBackground, slideshowTime);

const launcherMenu = document.getElementById("launcherMenu");

bentoButton.addEventListener("click", function(event) {
    launcherMenu.classList.toggle("show-menu");
    event.stopPropagation();
});

window.addEventListener("click", function(event) {
    if (!launcherMenu.contains(event.target) && event.target !== bentoButton) {
        launcherMenu.classList.remove("show-menu");
    }
});

    document.querySelector('.search-box button').style.color = targetColor;
    launcherMenu.style.borderColor = targetColor;
    
    // Updates dynamic element structures
    const elementsToPaint = document.querySelectorAll(".link-card, .bento-dot, #scratchPad");
    elementsToPaint.forEach(el => {
        el.style.color = targetColor;
        el.style.borderColor = targetColor;
    });

    // Update avatar borders dynamically to match theme picker
    document.getElementById('gAvatar').style.borderColor = targetColor;
    document.getElementById('mAvatar').style.borderColor = targetColor;
}
